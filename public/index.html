<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IntentDock — Coming Soon</title>
  <meta name="description" content="IntentDock is building something new. Our site is under construction — check back soon.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://intentdock.io/">

  <!-- Social previews -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://intentdock.io/">
  <meta property="og:title" content="IntentDock — Coming Soon">
  <meta property="og:description" content="We're building something new. Our site is under construction — check back soon.">
  <meta name="twitter:card" content="summary">

  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b5bf7'/%3E%3Cpath d='M18 40h28M24 40V24l8-6 8 6v16' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --text: #12141a;
      --muted: #5c6270;
      --border: #e3e6ee;
      --accent: #5b5bf7;
      --accent-2: #19b5c9;
      --glow: rgba(91, 91, 247, 0.18);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d12;
        --surface: #12151d;
        --text: #eef0f6;
        --muted: #9aa1b2;
        --border: #232838;
        --accent: #8183ff;
        --accent-2: #3fd0e0;
        --glow: rgba(129, 131, 255, 0.22);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
      overflow-x: hidden;
      position: relative;
    }

    /* Soft background glow */
    body::before {
      content: "";
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 70vh;
      background:
        radial-gradient(40% 60% at 30% 40%, var(--glow), transparent 70%),
        radial-gradient(35% 50% at 75% 30%, rgba(25, 181, 201, 0.14), transparent 70%);
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
    }

    header, main, footer { position: relative; z-index: 1; }

    header {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding-block: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .logo {
      width: 32px;
      height: 32px;
      flex: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 40px 64px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5a524;
      box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.55); }
      70%  { box-shadow: 0 0 0 8px rgba(245, 165, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 165, 36, 0); }
    }

    h1 {
      margin: 24px 0 16px;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 750;
    }

    .gradient {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.lead {
      margin: 0 auto;
      max-width: 34em;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      color: var(--muted);
    }

    .progress {
      margin: 40px auto 0;
      max-width: 320px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: slide 2.4s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot, .progress span { animation: none; }
      .progress span { width: 60%; }
    }

    footer {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding-block: 24px 32px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b5bf7"/>
          <stop offset="1" stop-color="#19b5c9"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="14" fill="url(#g)"/>
      <path d="M18 40h28M24 40V24l8-6 8 6v16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>IntentDock</span>
  </header>

  <main>
    <section class="card">
      <span class="badge"><span class="dot" aria-hidden="true"></span>Under construction</span>
      <h1>Something new is <span class="gradient">docking soon.</span></h1>
      <p class="lead">
        We're building IntentDock and putting the finishing touches on our site.
        Thanks for stopping by. Check back soon.
      </p>
      <div class="progress" role="presentation"><span></span></div>
    </section>
  </main>

  <footer>
    &copy; <span id="year">2026</span> IntentDock &middot; intentdock.io
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
